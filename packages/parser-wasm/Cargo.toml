[package]
name = "parser-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "WebAssembly Markdown parser runtime used by Linnya"
repository = "https://github.com/linnlabs/linnya"

[dependencies]
wasm-bindgen = "0.2"
pulldown-cmark = "0.13.0" # 或最新稳定版
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = { version = "0.6.0" } # 用于结构体到 JS 对象的转换
js-sys = '0.3'
serde_json = "1.0"
console_error_panic_hook = { version = "0.1.7", optional = true }

# 新增的依赖
regex = "1"          # 例如 "1.10.4"
once_cell = "1"      # 例如 "1.19.0"

[lib]
crate-type = ["cdylib"] # 声明为动态库给 WASM

# 添加以下部分来禁用 wasm-opt
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev] # 也为开发模式禁用 (如果需要)
wasm-opt = false

[features]
default = ["console_error_panic_hook"]
