name: Public Required

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-required-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture and supply-chain gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run public architecture gates
        run: |
          pnpm run guard:github-actions-pinned
          pnpm run guard:agents-links
          pnpm run guard:public-source-sanitization
          pnpm run guard:public-document-boundary
          pnpm run guard:remote-telemetry-boundary
          pnpm run guard:public-package-private-plugin-boundary
          pnpm run guard:agent-boundary
          pnpm run guard:tsc-baseline
          pnpm run guard:shell-tool-boundary
          pnpm run guard:markdown-domain-boundary
          pnpm run guard:tool-directory-boundary
          pnpm run guard:model-inference-boundary
          pnpm run guard:provider-package-boundary
          pnpm run guard:no-empty-catch
          pnpm run guard:renderer-module-resolution
          pnpm run lint:style
          pnpm run guard:no-font-binary-fixtures
          pnpm run test:dependency-license-evidence
          pnpm run guard:dependency-license-evidence:public
          pnpm run test:production-package-lock
          pnpm run release:lock:production:verify
          pnpm run test:artifact-content-bom

  packages:
    name: Public package and plugin gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify public packages
        run: |
          pnpm run test:schemas-package-gate
          pnpm run test:provider-package-gate
          pnpm run test:renderer-ui-package-gate
          pnpm --filter @linnya/plugin-host-contract typecheck
          pnpm --filter @plugin/mindmap typecheck
          pnpm --filter @plugin/slides typecheck
          pnpm run test:workspace-plugins

  tests:
    name: Public test suite
    # 完整 backend 会构建 Desktop Plugin CLI native client；产品当前只支持 macOS/Windows，
    # 因此不能用没有正式 runtime target 的 Linux 冒充受支持宿主。
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests without external credentials
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
          cargo install wasm-pack --version 0.15.0 --locked
          pnpm run build:wasm
          pnpm run build:schemas
          pnpm run build:main
          pnpm run build:backend
          pnpm test
