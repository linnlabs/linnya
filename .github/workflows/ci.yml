name: Public Required

on:
  workflow_call:
    inputs:
      architecture-only:
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR 只保留最新推送；main 每次运行独立分组，排队中的提交也不会被替换。
  group: public-required-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  architecture:
    name: Architecture and supply-chain gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint code
        run: pnpm run lint:code
      - name: Run public architecture gates
        run: |
          pnpm run guard:tsc-baseline
          pnpm run guard:plugin-boundaries
          node scripts/guards/run-parallel-pnpm-scripts.mjs \
            guard:shell-tool-boundary \
            guard:no-empty-catch \
            lint:style \
            guard:public-source-sanitization \
            guard:renderer-state-boundary \
            release:lock:production:audit \
            guard:model-inference-boundary \
            guard:markdown-links \
            guard:remote-telemetry-boundary \
            guard:public-package-private-plugin-boundary \
            guard:module-barrel-boundary \
            guard:public-document-boundary \
            guard:github-actions-pinned \
            guard:markdown-domain-boundary \
            guard:shared-implementations \
            guard:provider-package-boundary \
            guard:tool-directory-boundary \
            guard:dependency-license-evidence:public \
            guard:renderer-module-resolution \
            test:artifact-content-bom \
            test:production-package-lock \
            test:dependency-license-evidence \
            guard:no-font-binary-fixtures

  packages:
    if: ${{ !inputs.architecture-only }}
    name: Public package and plugin gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify schemas and provider package gates
        run: |
          pnpm run test:schemas-package-gate
          pnpm run test:provider-package-gate
      - name: Verify renderer-ui and workspace package checks
        run: |
          pnpm --filter @plugin/slides lint
          pnpm run test:renderer-ui-package-gate
          pnpm run typecheck:linnya-cli
          pnpm --filter @linnya/foundation typecheck
          pnpm --filter @linnya/plugin-host-contract typecheck
          pnpm --filter @plugin/slides typecheck
      - name: Run workspace plugin tests
        run: pnpm run test:workspace-plugins:except-canvas
      # 与 Canvas 回归使用同一条命令。本机共用检出时复用结果；GitHub 的独立 runner 各自验证。
      - name: Run Canvas business cases
        run: pnpm --filter @plugin/canvas test

  test-shards:
    if: ${{ !inputs.architecture-only }}
    name: Public tests (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # 完整 backend 会构建 Desktop Plugin CLI native client；产品当前只支持 macOS/Windows，
    # 因此不能用没有正式 runtime target 的 Linux 冒充受支持宿主。
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare Rust build tools
        uses: ./.github/actions/setup-rust-build
      - name: Build WASM
        run: pnpm run build:wasm
      - name: Build Backend and its workspace dependencies
        # build:backend 已拥有 schemas 的准备；不再提前重复编译一次。
        run: pnpm run build:backend
      - name: Build Canvas worker for Host integration tests
        # 真实 Host 测试需要本任务构建的 Worker 产物。
        run: pnpm --filter @plugin/canvas build:backend
      - name: Build Electron Main
        run: pnpm run build:main
      - name: Run tests without external credentials
        # 部分恢复用例会再起一个 Vitest 子进程；给冷编译和子进程留出 runner 资源，
        # 避免全核并发把计算型测试与进程就绪检查一起挤出各自的期限。
        run: pnpm exec vitest run --maxWorkers=2 --shard=${{ matrix.shard }}/3

  tests:
    # 保留原必需检查名称；任一分片失败、取消或未运行都不能给出绿灯。
    name: Public test suite
    if: always() && !inputs.architecture-only
    needs: [test-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test shard to pass
        env:
          SHARDS_RESULT: ${{ needs.test-shards.result }}
        run: test "$SHARDS_RESULT" = success
