name: Public Required

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR 只保留最新推送；main 每次运行独立分组，排队中的提交也不会被替换。
  group: public-required-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  architecture:
    name: Architecture and supply-chain gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run public architecture gates
        run: |
          pnpm run guard:github-actions-pinned
          pnpm run guard:agents-links
          pnpm run guard:public-source-sanitization
          pnpm run guard:public-document-boundary
          pnpm run guard:remote-telemetry-boundary
          pnpm run guard:public-package-private-plugin-boundary
          pnpm run guard:agent-boundary
          pnpm run guard:plugin-table-ownership
          pnpm run guard:tsc-baseline
          pnpm run guard:shell-tool-boundary
          pnpm run guard:markdown-domain-boundary
          pnpm run guard:tool-directory-boundary
          pnpm run guard:model-inference-boundary
          pnpm run guard:provider-package-boundary
          pnpm run guard:no-empty-catch
          pnpm run guard:renderer-module-resolution
          pnpm run lint:style
          pnpm run guard:no-font-binary-fixtures
          pnpm run test:dependency-license-evidence
          pnpm run guard:dependency-license-evidence:public
          pnpm run test:production-package-lock
          pnpm run release:lock:production:verify
          pnpm run test:artifact-content-bom

  packages:
    name: Public package and plugin gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify public packages
        run: |
          pnpm run test:schemas-package-gate
          pnpm run typecheck:linnya-cli
          pnpm run test:provider-package-gate
          pnpm run test:renderer-ui-package-gate
          pnpm --filter @linnya/plugin-host-contract typecheck
          pnpm --filter @plugin/mindmap typecheck
          pnpm --filter @plugin/slides lint
          pnpm --filter @plugin/slides typecheck
          pnpm run test:workspace-plugins

  test-shards:
    name: Public tests (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # 完整 backend 会构建 Desktop Plugin CLI native client；产品当前只支持 macOS/Windows，
    # 因此不能用没有正式 runtime target 的 Linux 冒充受支持宿主。
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare Rust build tools
        uses: ./.github/actions/setup-rust-build
      - name: Build WASM
        run: pnpm run build:wasm
      - name: Build Backend and its workspace dependencies
        # build:backend 已拥有 schemas 的准备；不再提前重复编译一次。
        run: pnpm run build:backend
      - name: Build Canvas worker for Host integration tests
        # Canvas不在发行目标里；真实Host测试仍须在本job拥有自己的实际Worker产物。
        run: pnpm --filter @plugin/canvas build:backend
      - name: Build Electron Main
        run: pnpm run build:main
      - name: Run tests without external credentials
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/3

  tests:
    # 保留原必需检查名称；任一分片失败、取消或未运行都不能给出绿灯。
    name: Public test suite
    if: always()
    needs: [test-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test shard to pass
        env:
          SHARDS_RESULT: ${{ needs.test-shards.result }}
        run: test "$SHARDS_RESULT" = success
