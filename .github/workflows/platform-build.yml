name: Public Platform Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    name: Source build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linnya Desktop 当前只发布 macOS/Windows；Windows 原生依赖仍要求 Visual Studio 2022。
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Rust build tools
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
          cargo install wasm-pack --version 0.15.0 --locked
      - name: Build public source surfaces
        run: |
          pnpm run build:wasm
          pnpm run build:schemas
          pnpm run build:frontend
          pnpm run build:main
          pnpm run build:preload
          pnpm run build:backend
          pnpm run build:plugin:mindmap
          pnpm run build:plugin:slides
          pnpm run build:linnya-cli
