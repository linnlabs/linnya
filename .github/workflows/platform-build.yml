name: Public Platform Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    name: Source build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linnya Desktop 当前只发布 macOS/Windows；Windows 原生依赖仍要求 Visual Studio 2022。
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Rust build tools
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
          cargo install wasm-pack --version 0.15.0 --locked
      # 每个原生命令独立成 step，避免 PowerShell 用后续成功的退出码掩盖前一步失败。
      - name: Package official plugins from a clean checkout
        run: pnpm run package:plugins:official
      - name: Build WASM
        run: pnpm run build:wasm
      - name: Build Renderer
        run: pnpm run build:frontend
      - name: Build Electron Main
        run: pnpm run build:main
      - name: Build Preload
        run: pnpm run build:preload
      - name: Build Backend
        run: pnpm run build:backend
      - name: Build CLI
        run: pnpm run build:linnya-cli
      - name: Verify built CLI against bridge
        run: pnpm exec cross-env LINNYA_CLI_TEST_ENTRY=bundle vitest run apps/linnya-cli/src/__integration-tests__
      - name: Verify real Runtime lifecycle and approval on macOS
        if: runner.os == 'macOS'
        run: pnpm run test:linnya-runtime:e2e
