name: Prepare Rust build tools
description: Pinned prebuilt WASM tools and bounded Cargo dependency caches
inputs:
  repository:
    description: Public source checkout relative to the workspace
    default: .
runs:
  using: composite
  steps:
    - name: Select pinned Rust toolchain
      shell: bash
      run: |
        rustup toolchain install 1.97.0 --profile minimal --target wasm32-unknown-unknown
        rustup default 1.97.0
    - name: Read wasm-bindgen version from Cargo.lock
      id: bindgen
      shell: bash
      working-directory: ${{ inputs.repository }}
      run: |
        node --input-type=module <<'NODE'
        import { readFileSync, appendFileSync } from 'node:fs';
        import assert from 'node:assert/strict';
        const lock = readFileSync('packages/parser-wasm/Cargo.lock', 'utf8');
        const entry = lock.split('[[package]]').find(value => /^name = "wasm-bindgen"$/mu.test(value));
        const version = entry?.match(/^version = "([0-9.]+)"$/mu)?.[1];
        assert.ok(version, 'Cargo.lock must pin wasm-bindgen');
        appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
        NODE
    - name: Install prebuilt WASM tools with checksum verification
      uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2
      with:
        tool: wasm-pack@0.15.0,wasm-bindgen-cli@${{ steps.bindgen.outputs.version }}
        checksum: true
        fallback: none
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        # 同一平台的测试分片与源码构建共享依赖；不缓存发行包或凭据。
        shared-key: desktop-rust
        cache-bin: false
        save-if: ${{ github.ref == 'refs/heads/main' }}
        workspaces: |
          ${{ inputs.repository }}/packages/parser-wasm
          ${{ inputs.repository }}/src/infra/adapters/command-runtime/plugin-cli-client/native
          ${{ inputs.repository }}/src/infra/adapters/command-runtime/windows/native
